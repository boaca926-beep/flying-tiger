services:
  postgres:
    image: postgres:16
    container_name: ft-postgres
    environment:
      POSTGRES_USER: ft_user
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: pilot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ft_user -d pilot"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata: