services:
  ft-test:
    build: .  # Bygger från Dockerfile i samma mapp
    container_name: ft-test
    ports:
      - "8501:8501"
    environment:
      # Miljövariabler för att lösa Unicode-felet
      - PYTHONUTF8=1
      - PYTHONIOENCODING=utf-8
      - LANG=C.UTF-8
      
      # Miljövariabler för databasanslutningen (VIKTIGT: DB_HOST är ft-postgres)
      - DB_HOST=ft-postgres
      - DB_PORT=5432
      - DB_USER=ft_user
      - DB_PASSWORD=dev
      - DB_NAME=pilot
    depends_on:
      postgres:
        condition: service_healthy # Vänta tills databasen är redo innan appen startar

  postgres:
    image: postgres:16
    container_name: ft-postgres
    environment:
      POSTGRES_USER: ft_user
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: pilot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ft_user -d pilot"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata: