name: Update Flying Tiger Database

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper
        run: python main.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FT_BASE_URL: https://flyingtiger.com
          FT_CURRENCY: EUR